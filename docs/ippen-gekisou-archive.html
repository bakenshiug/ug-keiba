<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>一変激走神宮アーカイブ ｜ UG競馬神宮</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;900&family=Noto+Sans+JP:wght@400;700;900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --shu:#9b2d30;
    --shu-dk:#7a1e21;
    --kin:#c9a84c;
    --kin-deep:#a07b28;
    --paper:#FBF7EE;
    --paper-deep:#F0EADB;
    --ink:#2c1f12;
    --ink-soft:#6b5d4b;
    --border:rgba(155,45,48,.2);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);
       font-family:'Noto Sans JP',sans-serif;line-height:1.7;min-height:100vh;
       background-image:radial-gradient(circle at 10% 20%,rgba(201,168,76,.06),transparent 40%),
                        radial-gradient(circle at 90% 80%,rgba(155,45,48,.05),transparent 40%);}
  .mincho{font-family:'Shippori Mincho',serif;letter-spacing:.05em}

  header{padding:40px 16px 28px;text-align:center;
         background:linear-gradient(135deg,#fff8e8 0%,#fff5dc 50%,#fff8e8 100%);
         border-bottom:3px solid var(--kin)}
  .h-tiger{font-size:56px;line-height:1;margin-bottom:12px;
           filter:drop-shadow(2px 4px 8px rgba(0,0,0,.12))}
  .h-title{font-size:28px;color:var(--shu);font-weight:900;letter-spacing:.3em;
           font-family:'Shippori Mincho',serif;padding-left:.3em}
  .h-sub{font-size:13px;color:var(--ink-soft);margin-top:10px;letter-spacing:.18em;
         font-family:'Shippori Mincho',serif}
  .home-link{display:inline-block;margin-top:16px;padding:7px 18px;
             border:1.5px solid var(--kin-deep);color:var(--kin-deep);
             text-decoration:none;font-size:12px;letter-spacing:.2em;
             border-radius:4px;font-family:'Shippori Mincho',serif;
             transition:all .2s}
  .home-link:hover{background:var(--kin-deep);color:#fff}

  main{max-width:820px;margin:0 auto;padding:36px 16px 80px}

  .section-note{text-align:center;font-size:13px;color:var(--ink-soft);
                letter-spacing:.12em;margin-bottom:28px;
                font-family:'Shippori Mincho',serif;
                padding:12px;border-bottom:1px solid rgba(201,168,76,.3)}

  .archive-list{display:grid;gap:14px}

  .archive-card{display:block;padding:22px 24px;
                background:linear-gradient(135deg,#fff 0%,#fffbf0 100%);
                border:1.5px solid rgba(201,168,76,.5);border-radius:10px;
                text-decoration:none;color:var(--ink);
                transition:all .25s ease;position:relative;overflow:hidden}
  .archive-card::before{content:"";position:absolute;inset:0;
                        background:radial-gradient(circle at top right,rgba(201,168,76,.1),transparent 60%);
                        pointer-events:none}
  .archive-card:hover{border-color:var(--shu);transform:translateY(-2px);
                      box-shadow:0 6px 20px rgba(155,45,48,.15)}
  .ac-date{font-family:'Inter',sans-serif;font-size:22px;font-weight:900;
           color:var(--kin-deep);letter-spacing:.04em}
  .ac-label{font-size:17px;color:var(--shu);font-weight:700;margin-top:6px;
            letter-spacing:.08em;font-family:'Shippori Mincho',serif}
  .ac-meta{font-size:12px;color:var(--ink-soft);margin-top:8px;letter-spacing:.05em}
  .ac-meta b{color:var(--ink)}
  .ac-arrow{position:absolute;right:22px;top:50%;transform:translateY(-50%);
            font-size:22px;color:var(--shu);transition:transform .2s ease;opacity:.7}
  .archive-card:hover .ac-arrow{transform:translateY(-50%) translateX(4px);opacity:1}

  .empty-msg{text-align:center;padding:60px 20px;color:var(--ink-soft);font-style:italic}

  footer{margin-top:60px;padding:24px 16px;text-align:center;
         background:var(--paper-deep);border-top:1px solid rgba(201,168,76,.4);
         font-size:12px;color:var(--ink-soft);font-family:'Shippori Mincho',serif;
         letter-spacing:.08em}
  footer a{color:var(--shu);text-decoration:none}
  footer a:hover{text-decoration:underline}
</style>
</head>
<body>

<header>
  <div class="h-tiger">🐅</div>
  <div class="h-title mincho">一 変 激 走 神 宮</div>
  <div class="h-sub">ARCHIVE ─ 初ブリンカー・一変激走馬の記録</div>
  <a href="ippen-gekisou.html" class="home-link mincho">最新週へ戻る ▶</a>
</header>

<main>
  <p class="section-note mincho">
    西 方 の 神 ・ 一 変 激 走 神 宮 ／ 過 去 の 初 ブ リ ン カ ー 大 吉 馬 記 録
  </p>

  <div id="archive-list" class="archive-list">
    <div class="empty-msg">読み込み中…</div>
  </div>
</main>

<footer>
  最新予想は <a href="kotodama.html">⛩ 言霊神宮</a> ／
  一変激走 <a href="ippen-gekisou.html">🐅 最新週</a> ／
  神宮トップ <a href="index.html">⛩ 戻る</a>
</footer>

<script>
// アーカイブデータ：新しい週から順に先頭に追加
const ARCHIVES = [
  {
    date: "2026-05-16-17",
    label: "ヴィクトリアマイル週",
    note: "土曜8頭・日曜7頭 馬券圏内 ／ 土日総合回収率530.4%",
    highlight: "ターフクリスタル 1着（単¥14,990）/ リュウセイコウテイ 複勝圏（複¥1,510）",
    file: "ippen-archive-2026-05-16-17.html"
  },
  {
    date: "2026-05-09-10",
    label: "NHKマイル週",
    note: "8頭馬券圏内 ／ 二桁人気4頭・万馬券級3頭",
    highlight: "キボウホー 12人気2着（単117.6倍）/ アイアンクラッド 10人気1着（単90.1倍）",
    file: "ippen-archive-2026-05-09-10.html"
  },
  // 新しい週は先頭に追加
];

function renderArchives(){
  const root = document.getElementById('archive-list');
  if (!ARCHIVES.length){
    root.innerHTML = '<div class="empty-msg">アーカイブはまだありません</div>';
    return;
  }
  root.innerHTML = ARCHIVES.map(a => `
    <a href="${a.file}" class="archive-card">
      <div class="ac-date">${a.date}</div>
      <div class="ac-label mincho">${a.label}</div>
      <div class="ac-meta">${a.note}</div>
      ${a.highlight ? `<div class="ac-meta" style="margin-top:4px;color:var(--shu)"><b>🐅 ${a.highlight}</b></div>` : ''}
      <span class="ac-arrow">▶</span>
    </a>
  `).join('');
}

renderArchives();
</script>

</body>
</html>
