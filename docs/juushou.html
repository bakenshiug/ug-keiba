<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>重賞天満宮｜UG競馬神宮</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Sans+JP:wght@400;700;900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#FAFAFA; --bg-soft:#F5F2EB; --paper:#FBF7EE; --paper-deep:#F0EADB;
    --ink:#2c1f12; --ink-soft:#5a4a3a;
    --shu:#a44a3f; --shu-dk:#7A1E1E;
    --gold:#c9a84c; --gold-dk:#b8860b;
    --ok:#5fa85c; --border:rgba(164,74,63,.25);
  }
  body{background:var(--bg);color:var(--ink);
       font-family:'Noto Sans JP',sans-serif;line-height:1.7;min-height:100vh}
  .mincho{font-family:'Shippori Mincho',serif;letter-spacing:.05em}
  .num{font-family:'Inter',sans-serif;font-weight:900}

  /* ── ヘッダー ── */
  header{padding:32px 16px 24px;text-align:center;
         background:linear-gradient(135deg,#fff8e8 0%,#fff5dc 50%,#fff8e8 100%);
         border-bottom:2px solid var(--gold)}
  .h-title{font-size:32px;color:var(--gold-dk);font-weight:700;letter-spacing:.4em}
  .h-sub{font-size:13px;color:var(--ink-soft);margin-top:8px;letter-spacing:.15em}
  .h-rule{font-size:13px;color:var(--gold-dk);margin-top:12px;font-weight:700;letter-spacing:.15em}
  .home-link{display:inline-block;margin-top:14px;padding:6px 16px;
             border:1px solid var(--gold-dk);color:var(--gold-dk);text-decoration:none;
             font-size:12px;letter-spacing:.2em;border-radius:4px}
  .home-link:hover{background:var(--gold-dk);color:#fff}

  main{max-width:920px;margin:0 auto;padding:24px 16px}

  /* ── レースカード（折り畳み大型） ── */
  details.race-card{margin-bottom:24px;background:var(--paper);
             border:2px solid var(--gold);border-radius:14px;
             box-shadow:0 4px 20px rgba(201,168,76,.18);overflow:hidden}
  details.race-card[open]{margin-bottom:48px}
  details.race-card.shobu{border-color:var(--shu);
                   box-shadow:0 0 24px rgba(164,74,63,.25),0 4px 20px rgba(164,74,63,.15);
                   animation:shobupulse 2.6s ease-in-out infinite}
  @keyframes shobupulse{
    0%,100%{box-shadow:0 0 24px rgba(164,74,63,.25),0 4px 20px rgba(164,74,63,.15)}
    50%   {box-shadow:0 0 36px rgba(164,74,63,.45),0 4px 20px rgba(164,74,63,.25)}
  }
  .race-head{background:linear-gradient(135deg,#fff6e8 0%,#fff5dc 100%);
             padding:20px 26px;border-bottom:2px dashed var(--gold);
             cursor:pointer;list-style:none;
             display:flex;align-items:flex-start;gap:14px;
             transition:background .15s ease}
  .race-head::-webkit-details-marker{display:none}
  .race-head:hover{background:linear-gradient(135deg,#fff0c8 0%,#ffe8c0 100%)}
  details.race-card.shobu .race-head{background:linear-gradient(135deg,#ffe8e8 0%,#fff5dc 100%);
                              border-bottom-color:var(--shu)}
  details.race-card.shobu .race-head:hover{background:linear-gradient(135deg,#ffd8d8 0%,#fff0c8 100%)}
  .race-fold-icon{font-size:18px;color:var(--gold-dk);
                  transition:transform .25s ease;flex-shrink:0;line-height:1.4}
  details.race-card[open] .race-fold-icon{transform:rotate(90deg)}
  details.race-card.shobu .race-fold-icon{color:var(--shu-dk)}
  .race-head-body{flex:1}
  .race-grade{display:inline-block;padding:4px 12px;background:var(--shu);color:#fff;
              border-radius:4px;font-weight:900;letter-spacing:.15em;font-size:13px;
              margin-right:8px}
  .race-card.shobu .race-grade{background:linear-gradient(135deg,#a44a3f,#7A1E1E)}
  .race-shobu-badge{display:inline-block;padding:4px 12px;background:linear-gradient(135deg,#f4d03f,#b8860b);
                    color:#3a2a00;border-radius:4px;font-weight:900;letter-spacing:.15em;font-size:12px;
                    margin-left:6px;box-shadow:0 0 8px rgba(212,175,55,.5)}
  .race-name{font-size:24px;color:var(--shu);font-weight:700;margin-top:8px;letter-spacing:.05em}
  .race-meta{font-size:13px;color:var(--ink-soft);margin-top:8px;letter-spacing:.05em}
  .race-meta .item{margin-right:14px}
  .race-meta b{color:var(--ink)}

  .race-body{padding:24px 28px}

  /* ── トレンド分析 ── */
  .sec-h{font-family:'Shippori Mincho',serif;font-size:16px;color:var(--shu);
         font-weight:700;letter-spacing:.15em;margin:18px 0 12px;
         padding-left:12px;border-left:4px solid var(--gold)}
  /* 折りたたみ */
  .sec-details{margin:14px 0}
  .sec-details>summary{
    list-style:none;cursor:pointer;user-select:none;
    font-family:'Shippori Mincho',serif;font-size:16px;color:var(--shu);
    font-weight:700;letter-spacing:.15em;margin:0 0 12px;
    padding:8px 12px;border-left:4px solid var(--gold);
    display:flex;align-items:center;justify-content:space-between;
    border-radius:0 4px 4px 0;background:rgba(201,168,76,.06);
  }
  .sec-details>summary::-webkit-details-marker{display:none}
  .sec-details>summary::after{content:'▼';font-size:10px;color:var(--gold);transition:transform .25s;flex-shrink:0}
  .sec-details[open]>summary::after{transform:rotate(180deg)}
  .sec-details>summary:hover{background:rgba(201,168,76,.12)}
  .trend-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:600px){.trend-grid{grid-template-columns:1fr}}
  .trend-card{background:#fff;border:1px solid var(--border);border-radius:6px;padding:12px 14px}
  .trend-card.high{border-color:var(--gold);background:linear-gradient(135deg,#fff8e8 0%,#fff5dc 100%);
                   box-shadow:0 1px 4px rgba(201,168,76,.15)}
  .trend-card.extreme{border-color:var(--shu);background:linear-gradient(135deg,#fff0e8 0%,#fff5dc 100%);
                     box-shadow:0 0 12px rgba(164,74,63,.25)}
  .trend-card.caution{border-color:#cc8888;background:rgba(204,136,136,.06)}
  .trend-card.middle{border-color:rgba(201,168,76,.5)}
  .trend-label{font-family:'Shippori Mincho',serif;font-size:13px;color:var(--shu);font-weight:700;
               margin-bottom:5px;letter-spacing:.05em}
  .trend-card.extreme .trend-label{color:var(--shu-dk)}
  .trend-value{font-size:12.5px;color:var(--ink);line-height:1.7}

  /* ── 過去10年テーブル ── */
  .history-table{width:100%;border-collapse:collapse;font-size:12px;
                 background:#fff;border-radius:6px;overflow:hidden;
                 box-shadow:0 1px 6px rgba(155,45,48,.06)}
  .history-table th{background:var(--shu);color:#fff;padding:8px 6px;
                    font-weight:700;font-size:11px;letter-spacing:.05em;text-align:center}
  .history-table td{padding:8px 6px;border-bottom:1px dashed var(--border);
                    text-align:center;color:var(--ink)}
  .history-table tr:last-child td{border-bottom:none}
  .history-table .ht-year{font-family:'Inter',sans-serif;font-weight:900;color:var(--gold-dk)}
  .history-table .ht-name{font-family:'Shippori Mincho',serif;font-weight:700;text-align:left;padding-left:8px}
  .history-table .ht-pop{font-weight:700}
  .history-table .ht-pop.win-pop{color:var(--shu-dk);background:rgba(212,175,55,.15)}
  .history-table .ht-num{font-family:'Inter',sans-serif;font-weight:900;
                         display:inline-block;min-width:24px;padding:2px 6px;
                         background:var(--paper-deep);border-radius:3px;font-size:11px}
  .history-table tr.popular-pop td{background:rgba(212,175,55,.06)}
  .history-overflow{overflow-x:auto;margin-top:8px}

  /* ── 参考リンク ── */
  .ref-link{display:inline-block;margin-top:14px;padding:6px 14px;
            background:var(--paper-deep);border:1px solid var(--border);
            border-radius:4px;color:var(--shu);text-decoration:none;
            font-size:11px;letter-spacing:.1em}
  .ref-link:hover{background:var(--shu);color:#fff}

  /* ── 勝負鞍 注釈 ── */
  .shobu-note{background:linear-gradient(135deg,rgba(164,74,63,.08) 0%,rgba(212,175,55,.1) 100%);
              border-left:5px solid var(--shu);
              padding:14px 18px;border-radius:6px;margin-top:18px;
              font-size:13px;line-height:1.85;color:var(--ink)}
  .shobu-note b{color:var(--shu)}

  /* ── 1週前ピックアップ（有力馬展望） ── */
  .preview-banner{margin-top:18px;padding:8px 14px;
                  background:linear-gradient(135deg,#1F4D2E 0%,#2c5e3a 100%);
                  color:#FBF7EE;border-radius:6px;font-size:11px;
                  letter-spacing:.15em;text-align:center;font-family:'Shippori Mincho',serif}
  .preview-banner b{color:var(--gold)}
  .preview-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
  .preview-card{background:#fff;border:1px solid var(--border);border-radius:8px;
                padding:14px 18px;box-shadow:0 1px 4px rgba(155,45,48,.06)}
  .preview-card.mare{border:2px solid #d4528a;
                     background:linear-gradient(135deg,#fff5f8 0%,#fff 100%)}
  /* 💥 爆穴候補 */
  .preview-card.bakuana{border:2px solid var(--shu);
                         background:linear-gradient(135deg,#fff0e8 0%,#fff8e8 100%);
                         box-shadow:0 0 16px rgba(164,74,63,.3),0 1px 4px rgba(155,45,48,.1);
                         animation:bakuanaPulse 2.4s ease-in-out infinite;
                         position:relative}
  @keyframes bakuanaPulse{
    0%,100%{box-shadow:0 0 16px rgba(164,74,63,.3),0 1px 4px rgba(155,45,48,.1)}
    50%   {box-shadow:0 0 24px rgba(164,74,63,.55),0 1px 4px rgba(155,45,48,.15)}
  }
  .preview-card.bakuana .pc-tag{background:linear-gradient(135deg,#a44a3f,#7A1E1E);color:#fff}
  .preview-card.bakuana .pc-name{color:var(--shu-dk)}
  .preview-card.bakuana::before{
    content:'';display:none;position:absolute;top:-10px;right:14px;
    background:linear-gradient(135deg,#a44a3f,#7A1E1E);color:#fff;
    padding:4px 12px;border-radius:4px;font-size:11px;font-weight:900;
    letter-spacing:.15em;font-family:'Shippori Mincho',serif;
    box-shadow:0 2px 8px rgba(164,74,63,.4)
  }
  /* 🏆 勝利候補 */
  .preview-card.win-cand{border:2px solid var(--gold-dk);
                          background:linear-gradient(135deg,#fffbea 0%,#fff8dc 100%);
                          box-shadow:0 0 14px rgba(201,168,76,.35),0 2px 8px rgba(201,168,76,.15);
                          position:relative}
  .preview-card.win-cand .pc-tag{background:linear-gradient(135deg,#c9a84c,#b8860b);color:#fff}
  .preview-card.win-cand .pc-name{color:var(--gold-dk)}
  .preview-card.win-cand::before{
    content:'';display:none;position:absolute;top:-11px;right:14px;
    background:linear-gradient(135deg,#c9a84c,#b8860b);color:#fff;
    padding:3px 12px;border-radius:4px;font-size:11px;font-weight:900;
    letter-spacing:.15em;font-family:'Shippori Mincho',serif;
    box-shadow:0 2px 8px rgba(201,168,76,.4)
  }
  /* 🎯 相手候補 */
  .preview-card.place-cand{border:2px solid #7a8fa6;
                            background:linear-gradient(135deg,#f4f8fc 0%,#fff 100%);
                            position:relative}
  .preview-card.place-cand .pc-tag{background:#5a7fa0;color:#fff}
  .preview-card.place-cand .pc-name{color:#2d5a84}
  .preview-card.place-cand::before{
    content:'';display:none;position:absolute;top:-11px;right:14px;
    background:#5a7fa0;color:#fff;
    padding:3px 12px;border-radius:4px;font-size:11px;font-weight:900;
    letter-spacing:.15em;font-family:'Shippori Mincho',serif;
  }
  /* 👁 注意/消し */
  .preview-card.note-cand{border:1px solid #c0b8aa;
                           background:#faf9f6;opacity:.92}
  .preview-card.note-cand .pc-tag{background:#8a8070;color:#fff}
  /* 買い/懸念 */
  .pc-buy,.pc-concern{margin-top:7px;padding:7px 12px;border-radius:5px;font-size:12.5px;line-height:1.75}
  .pc-buy{background:#edf7ed;border-left:3px solid #4caf50}
  .pc-buy b{color:#2e7d32;margin-right:5px}
  .pc-concern{background:#fdf3f0;border-left:3px solid #ef5350}
  .pc-concern b{color:#c62828;margin-right:5px}
  /* ⚡💪 ラップ適性バッジ */
  .lap-badge{
    display:inline-flex;align-items:center;gap:3px;
    padding:2px 8px;border-radius:12px;font-size:10px;font-weight:800;
    letter-spacing:.08em;vertical-align:middle;margin-left:5px;
  }
  .lap-badge.syunpatsu{background:linear-gradient(135deg,#1565c0,#42a5f5);color:#fff;
    box-shadow:0 0 6px rgba(66,165,245,.5)}
  .lap-badge.jizoku{background:linear-gradient(135deg,#2e7d32,#66bb6a);color:#fff;
    box-shadow:0 0 6px rgba(102,187,106,.5)}
  /* ⛩️ 神宮馬バッジ */
  .jingu-uma-badge{
    display:inline-flex;align-items:center;gap:4px;
    padding:3px 10px;border-radius:20px;font-size:11px;font-weight:900;
    letter-spacing:.12em;font-family:'Shippori Mincho',serif;
    background:linear-gradient(135deg,#7a1e1e 0%,#a44a3f 50%,#c9a84c 100%);
    color:#fff;border:1px solid rgba(255,255,255,.3);
    box-shadow:0 0 8px rgba(164,74,63,.5),0 2px 6px rgba(201,168,76,.3);
    animation:jinguPulse 2.8s ease-in-out infinite;
    vertical-align:middle;margin-left:6px
  }
  @keyframes jinguPulse{
    0%,100%{box-shadow:0 0 8px rgba(164,74,63,.5),0 2px 6px rgba(201,168,76,.3)}
    50%    {box-shadow:0 0 16px rgba(164,74,63,.8),0 2px 10px rgba(201,168,76,.6)}
  }
  .pc-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
           padding-bottom:8px;margin-bottom:10px;border-bottom:1px dashed var(--border)}
  .pc-name{font-family:'Shippori Mincho',serif;font-size:17px;color:var(--shu);font-weight:700;letter-spacing:.05em}
  .pc-meta{font-size:11px;color:var(--ink-soft);font-family:'Inter',sans-serif}
  .pc-meta b{color:var(--ink)}
  .pc-tag{display:inline-block;padding:2px 8px;background:var(--gold);color:#3a2a00;
          border-radius:3px;font-size:10px;font-weight:700;letter-spacing:.08em;
          font-family:'Shippori Mincho',serif}
  .preview-card.mare .pc-tag{background:#d4528a;color:#fff}
  .pc-summary{font-size:12px;color:var(--ink-soft);margin-left:auto;font-weight:700}
  .pc-lastrap{display:block;width:100%;font-size:11px;color:var(--ink-soft);margin-top:2px;font-family:'Inter',sans-serif}
  .lr-chakujun{color:var(--shu);font-size:13px;font-family:'Inter',sans-serif}
  .lr-rote{display:inline-block;padding:1px 6px;background:#e8f4e8;color:#2e7d32;border-radius:3px;font-size:10px;font-weight:700}
  .lr-kyaku{display:inline-block;padding:1px 6px;background:#e8eaf6;color:#283593;border-radius:3px;font-size:10px;font-weight:700}
  .pc-view{font-size:13px;line-height:1.85;color:var(--ink)}

  /* 乖離バッジ（馬名横） */
  .kairi-badge{display:inline-block;margin-left:6px;padding:2px 8px;
    border-radius:10px;font-size:11px;font-weight:900;letter-spacing:.05em;
    font-family:'Inter','Shippori Mincho',sans-serif;
    vertical-align:middle;box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .kairi-badge.up-big{background:linear-gradient(135deg,#2e7d32,#1b5e20);color:#fff;
    animation:kairiUpPulse 2.2s ease-in-out infinite}
  .kairi-badge.up-mid{background:#4caf50;color:#fff}
  .kairi-badge.up-sml{background:#a5d6a7;color:#1b5e20}
  .kairi-badge.dn-big{background:linear-gradient(135deg,#c62828,#8e0000);color:#fff;
    animation:kairiDnPulse 2.2s ease-in-out infinite}
  .kairi-badge.dn-mid{background:#ef5350;color:#fff}
  .kairi-badge.dn-sml{background:#ffcdd2;color:#b71c1c}
  .kairi-badge.eq{background:#e0e0e0;color:#555}
  @keyframes kairiUpPulse{
    0%,100%{box-shadow:0 0 0 rgba(46,125,50,0)}
    50%{box-shadow:0 0 12px rgba(46,125,50,.7)}
  }
  @keyframes kairiDnPulse{
    0%,100%{box-shadow:0 0 0 rgba(198,40,40,0)}
    50%{box-shadow:0 0 12px rgba(198,40,40,.7)}
  }

  /* 乖離ダッシュボード */
  .kairi-board{margin:20px 0 24px;padding:18px 22px;
    background:linear-gradient(135deg,#fffbea 0%,#fff5d6 100%);
    border:2px solid var(--gold-dk);border-radius:8px;
    box-shadow:0 3px 12px rgba(201,168,76,.25)}
  .kairi-board h3{margin:0 0 14px;font-family:'Shippori Mincho',serif;
    font-size:16px;color:var(--gold-dk);letter-spacing:.1em;text-align:center;
    border-bottom:1px dashed var(--gold);padding-bottom:10px}
  .kairi-board-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:680px){.kairi-board-cols{grid-template-columns:1fr}}
  .kairi-col h4{margin:0 0 10px;font-size:13px;font-family:'Shippori Mincho',serif;
    letter-spacing:.08em;padding:4px 10px;border-radius:4px}
  .kairi-col.treasure h4{background:#e8f5e9;color:#1b5e20;border-left:4px solid #2e7d32}
  .kairi-col.trap h4{background:#ffebee;color:#b71c1c;border-left:4px solid #c62828}
  .kairi-row{display:flex;align-items:center;gap:8px;padding:6px 4px;
    font-size:12.5px;border-bottom:1px dotted #d8c898}
  .kairi-row:last-child{border-bottom:none}
  .kairi-row .k-icon{font-size:14px;flex-shrink:0}
  .kairi-row .k-name{font-weight:700;color:var(--ink);min-width:100px}
  .kairi-row .k-trans{font-size:11px;color:var(--ink-soft);font-family:'Inter',sans-serif}
  .kairi-row .k-delta{margin-left:auto;font-weight:900;font-family:'Inter',sans-serif}
  .kairi-row.up .k-delta{color:#1b5e20}
  .kairi-row.dn .k-delta{color:#b71c1c}
  /* 神宮人気コーナーリボン（カード左上） */
  .preview-card{position:relative}
  /* 🌈 ホログラム神託バッジ（神宮人気・全位共通） */
  .jingu-ninki-corner{
    position:absolute;top:-14px;right:-6px;z-index:5;
    padding:6px 18px;
    border-radius:999px;font-size:12.5px;font-weight:900;letter-spacing:.12em;
    font-family:'Shippori Mincho',serif;
    color:#2a1a4a;
    background:linear-gradient(135deg,
      #ffd1e8 0%, #d1c4ff 18%, #a8e6ff 36%,
      #c4ffe0 54%, #fff3a8 72%, #ffc4a8 90%, #ffd1e8 100%);
    background-size:300% 300%;
    box-shadow:0 3px 12px rgba(180,140,220,.45),
               0 0 0 2px rgba(255,255,255,.75) inset,
               0 0 8px rgba(255,255,255,.6);
    text-shadow:0 0 4px rgba(255,255,255,.8),0 1px 1px rgba(255,255,255,.5);
    white-space:nowrap;
    animation:hologramShift 4s ease-in-out infinite}
  @keyframes hologramShift{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
  }
  /* 1位=フルパワー神託（大型＋光輪パルス） */
  .jingu-ninki-corner.r1{
    padding:7px 22px;font-size:13.5px;
    background:linear-gradient(135deg,
      #ff9ec7 0%, #c0a8ff 14%, #8edcff 28%, #a8ffd6 42%,
      #fff58a 56%, #ffb88a 70%, #ff9ec7 84%, #c0a8ff 100%);
    background-size:400% 400%;
    box-shadow:0 4px 18px rgba(200,140,255,.7),
               0 0 0 2px rgba(255,255,255,.9) inset,
               0 0 20px rgba(255,200,255,.7);
    animation:hologramShift 3s ease-in-out infinite, hologramHalo 2.4s ease-in-out infinite}
  @keyframes hologramHalo{
    0%,100%{box-shadow:0 4px 18px rgba(200,140,255,.7),0 0 0 2px rgba(255,255,255,.9) inset,0 0 20px rgba(255,200,255,.7)}
    50%{box-shadow:0 6px 26px rgba(200,140,255,1),0 0 0 2px rgba(255,255,255,1) inset,0 0 32px rgba(255,220,255,1)}
  }
  /* 2位=ホログラム中強度 */
  .jingu-ninki-corner.r2{
    box-shadow:0 3px 14px rgba(180,160,220,.55),0 0 0 2px rgba(255,255,255,.8) inset,0 0 10px rgba(220,220,255,.7)}
  /* 3位=ホログラム標準 */
  .jingu-ninki-corner.r3{
    box-shadow:0 3px 12px rgba(180,160,200,.5),0 0 0 2px rgba(255,255,255,.75) inset,0 0 8px rgba(255,220,220,.6)}
  .pc-watch{margin-top:8px;padding:8px 12px;background:var(--bg-soft);border-radius:4px;
            font-size:11.5px;color:var(--ink-soft);border-left:3px solid var(--gold)}
  .pc-watch b{color:var(--gold-dk);margin-right:4px}

  /* ── ナビ ── */
  .race-nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;
            margin:0 auto 30px;max-width:780px;padding:0 16px}
  .race-nav a{padding:10px 18px;background:var(--paper);
              border:1px solid var(--gold);border-radius:6px;
              color:var(--gold-dk);text-decoration:none;font-size:13px;font-weight:700;
              font-family:'Shippori Mincho',serif;letter-spacing:.1em;transition:all .15s}
  .race-nav a:hover{background:var(--gold-dk);color:#fff}
  .race-nav a.shobu{background:linear-gradient(135deg,#fff6e8,#fff5dc);
                    border-color:var(--shu);color:var(--shu-dk)}
  .race-nav a.shobu:hover{background:var(--shu);color:#fff}

  footer{text-align:center;padding:24px;color:var(--ink-soft);font-size:11px;
         border-top:1px solid var(--border);margin-top:36px;background:var(--paper-deep)}
  footer a{color:var(--shu);text-decoration:none;font-weight:700;margin:0 8px}

  .loading{text-align:center;color:var(--ink-soft);padding:40px;font-style:italic}

  /* ── 神宮スコア ランキング全頭一覧 ── */
  .rank-board{margin:6px 0 8px;padding:14px 16px;background:#fff;border:1.5px solid var(--gold);border-radius:10px;box-shadow:0 2px 10px rgba(201,168,76,.15)}
  .rank-hint{text-align:center;font-size:10.5px;color:var(--ink-soft);margin-bottom:10px}
  .rank-list{display:flex;flex-direction:column;gap:2px}
  .rank-row{display:grid;grid-template-columns:30px 1fr 80px 44px;align-items:center;gap:7px;padding:5px 8px;border-radius:5px;font-size:12.5px}
  .rank-row:nth-child(even){background:rgba(201,168,76,.05)}
  .rank-row.axis{background:linear-gradient(90deg,rgba(244,208,63,.32),rgba(244,208,63,.06));border:1px solid var(--gold-dk)}
  .rk-pos{font-family:'Inter',sans-serif;font-weight:900;text-align:center;color:var(--shu);background:#f5ede0;border-radius:5px;padding:2px 0;font-size:12px}
  .rank-row.axis .rk-pos{background:linear-gradient(135deg,#f4d03f,#b8860b);color:#3a2a00}
  .rk-name{font-weight:700;font-family:'Shippori Mincho',serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rk-market{font-size:10.5px;color:var(--ink-soft);font-family:'Inter',sans-serif;text-align:right}
  .rk-kairi{font-family:'Inter',sans-serif;font-weight:900;text-align:right}
  .rk-kairi.up{color:#1b5e20}.rk-kairi.dn{color:#b71c1c}.rk-kairi.eq{color:#aaa}
  @media(max-width:600px){.rank-row{grid-template-columns:26px 1fr 64px 38px;gap:5px;font-size:11.5px}.rk-market{font-size:9.5px}}
</style>
</head>
<body>

<header>
  <div class="h-title mincho">重　賞　天　満　宮</div>
  <div class="h-sub mincho">JUUSHOU TENMANGU ─ 我、今週末の重賞を展望す</div>
  <div class="h-rule" id="weekend-label">読み込み中…</div>
  <a class="home-link mincho" href="index.html">⛩ 神宮に戻る</a>
</header>

<div style="max-width:920px;margin:20px auto 0;padding:0 16px">
  <a href="kotodama.html" style="
    display:flex;align-items:center;justify-content:center;gap:10px;
    padding:16px 24px;
    background:linear-gradient(135deg,#7A1E1E 0%,#a44a3f 50%,#c9a84c 100%);
    color:#fff;text-decoration:none;border-radius:10px;
    font-family:'Shippori Mincho',serif;font-size:17px;font-weight:700;
    letter-spacing:.2em;
    box-shadow:0 4px 18px rgba(164,74,63,.45);
    transition:all .2s ease;
    border:1px solid rgba(255,255,255,.2)
  " onmouseover="this.style.transform='translateY(-2px)';this.style.boxShadow='0 8px 28px rgba(164,74,63,.6)'"
     onmouseout="this.style.transform='';this.style.boxShadow='0 4px 18px rgba(164,74,63,.45)'">
    <span style="font-size:22px">⛩</span>
    <span>宝塚記念・函館SS 最終結論はこちら</span>
    <span style="font-size:18px;opacity:.85">▶</span>
  </a>

  <a href="juushou-guide.html" style="
    display:flex;align-items:center;justify-content:center;gap:10px;
    margin-top:12px;padding:14px 24px;
    background:linear-gradient(135deg,#fffbea 0%,#fff5d6 100%);
    color:#b8860b;text-decoration:none;border-radius:10px;
    font-family:'Shippori Mincho',serif;font-size:15px;font-weight:700;
    letter-spacing:.15em;
    box-shadow:0 3px 12px rgba(201,168,76,.3);
    transition:all .2s ease;
    border:2px solid #c9a84c
  " onmouseover="this.style.transform='translateY(-2px)';this.style.boxShadow='0 6px 20px rgba(201,168,76,.5)'"
     onmouseout="this.style.transform='';this.style.boxShadow='0 3px 12px rgba(201,168,76,.3)'">
    <span style="font-size:20px">🎯</span>
    <span>重賞天満宮の使い方 ─ 神宮オッズ×乖離で軸を射抜く</span>
    <span style="font-size:16px;opacity:.85">▶</span>
  </a>
</div>

<main id="main">
  <nav class="race-nav" id="race-nav"></nav>
  <div id="races"><div class="loading">⛩ 過去10年データ読み込み中…</div></div>
</main>

<footer>
  最終予想は <a href="kotodama.html">⛩ 言霊神宮</a> ／ 馬券道は <a href="how-to-buy.html">📋 通ずる道</a>
  <div style="margin-top:14px;font-size:12px;color:#888">
    📜 過去の重賞展望：
    <a href="archive/juushou-2026-06-06-07.html" style="margin-right:10px">6/6-7（安田記念）</a>
    <a href="archive/juushou-2026-05-30-31.html" style="margin-right:10px">5/30-31（日本ダービー/目黒記念）</a>
    <a href="archive/juushou-2026-05-23-24.html" style="margin-right:10px">5/23-24（オークス）</a>
    <a href="archive/juushou-2026-05-16-17.html" style="margin-right:10px">5/16-17（京都ハイジャンプ/新潟大賞典/ヴィクトリアマイル）</a>
    <a href="archive/juushou-2026-05-09-10.html">5/9-10（NHKマイル/京都新聞杯/京王杯SC/エプソムC）</a>
  </div>
</footer>

<script>
fetch('data/juushou/2026-06-13-14.json?_='+Date.now())
  .then(r => r.json())
  .then(d => {
    document.getElementById('weekend-label').textContent = `${d.weekend}（土日）の重賞展望`;

    // ナビ
    document.getElementById('race-nav').innerHTML = d.races.map(r =>
      `<a href="#${r.id}" data-target="${r.id}" class="${r.shoubuKurani?'shobu':''}">${r.weekday} ${r.name}${r.shoubuKurani?' 🔥':''}</a>`
    ).join('');
    // ナビクリック時に details を展開＋スクロール
    document.querySelectorAll('#race-nav a[data-target]').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        const id = a.dataset.target;
        const el = document.getElementById(id);
        if (el) {
          el.open = true;
          requestAnimationFrame(() => el.scrollIntoView({behavior:'smooth', block:'start'}));
        }
      });
    });

    // レースカード
    document.getElementById('races').innerHTML = d.races.map(r => {
      const shobu = r.shoubuKurani;
      // 過去10年テーブル
      const histRows = r.history.map(h => {
        const f = h.first;
        const popClass = f.pop <= 3 ? '' : 'win-pop';
        return `<tr>
          <td class="ht-year">${h.year}</td>
          <td>${h.date}</td>
          <td>${h.venue}<br><small style="color:var(--ink-soft);font-size:10px">${h.going}</small></td>
          <td><span class="ht-num">${f.num}</span></td>
          <td class="ht-name">${f.name}<br><small style="color:var(--ink-soft);font-size:10px">${f.sex} / 騎${f.jockey} / 厩${f.trainer}</small></td>
          <td class="ht-pop ${popClass}">${f.pop}</td>
          <td>${f.time}</td>
          <td>${f.weight}kg</td>
        </tr>`;
      }).join('');

      // 1〜3着馬まとめ
      const podiumRows = r.history.map(h => `
        <tr>
          <td class="ht-year">${h.year}</td>
          <td>🥇 <b>${h.first.num}</b> ${h.first.name} (${h.first.pop}人気)${h.first.ana ? ' 🔥' : ''}</td>
          <td>🥈 ${h.second.num} ${h.second.name} (${h.second.pop}人気)${h.second.ana ? ' 🔥' : ''}</td>
          <td>🥉 ${h.third.num} ${h.third.name} (${h.third.pop}人気)${h.third.ana ? ' 🔥' : ''}</td>
        </tr>`).join('');

      // 制覇馬トレンド
      const trendCards = r.trends.map(t => `
        <div class="trend-card ${t.weight}">
          <div class="trend-label">${t.label}</div>
          <div class="trend-value">${t.value}</div>
        </div>`).join('');

      // 馬券圏内トレンド（2・3着分析）
      const hakenCards = (r.trendsHaken || []).map(t => `
        <div class="trend-card ${t.weight}">
          <div class="trend-label">${t.label}</div>
          <div class="trend-value">${t.value}</div>
        </div>`).join('');

      return `
        <details class="race-card ${shobu?'shobu':''}" id="${r.id}" ${shobu?'open':''}>
          <summary class="race-head">
            <span class="race-fold-icon">▶</span>
            <div class="race-head-body">
              <div>
                <span class="race-grade mincho">${r.grade}</span>
                <span style="font-size:13px;color:var(--ink-soft);font-weight:700">${r.date.slice(5)}（${r.weekday}）</span>
                ${shobu?'<span class="race-shobu-badge mincho">🔥 勝負鞍</span>':''}
              </div>
              <div class="race-name mincho">${r.name}</div>
              <div class="race-meta">
                <span class="item">📍 <b>${r.venue}</b></span>
                <span class="item">🏇 <b>${r.course}</b></span>
                <span class="item">${r.category}</span>
              </div>
            </div>
          </summary>
          <div class="race-body">

            <details class="sec-details" open>
              <summary>🏆 制覇馬分析（過去10年トレンド）</summary>
              <div class="trend-grid">${trendCards}</div>
              ${hakenCards ? `
              <details class="sec-details" open style="margin-top:4px">
                <summary>🎫 馬券圏内分析（2・3着傾向）</summary>
                <div class="trend-grid">${hakenCards}</div>
              </details>` : ''}
            </details>

            <details class="sec-details" open>
              <summary>📜 過去10年 1〜3着馬</summary>
              <div class="history-overflow">
                <table class="history-table">
                  <thead>
                    <tr><th>年</th><th>1着</th><th>2着</th><th>3着</th></tr>
                  </thead>
                  <tbody>${podiumRows}</tbody>
                </table>
              </div>
            </details>

            ${shobu && r.shobu_note ? `
            <div class="shobu-note">
              <b>🔥 勝負鞍コメント</b><br>
              ${r.shobu_note}
            </div>` : ''}

            ${r.previewHorses && r.previewHorses.length ? `
            <details class="sec-details" open>
            <summary>📜 有力馬の神宮見立て</summary>
            <div class="preview-banner mincho">
              神宮独自の視点で再構成（出馬登録・動向は変動の可能性）
            </div>
            ${(() => {
              const ranked = [...r.previewHorses].filter(h=>h.jinguNinki).sort((a,b)=>(a.jinguNinki||999)-(b.jinguNinki||999));
              if (ranked.length === 0) return '';
              const tr = ranked.filter(h=>typeof h.kairi==='number'&&h.kairi>=3);
              const axisName = tr.length ? tr[0].name : null;
              const rows = ranked.map(h => {
                const k = h.kairi;
                const kcls = typeof k!=='number'?'eq':(k>0?'up':k<0?'dn':'eq');
                const ksign = typeof k!=='number'?'—':(k>0?'+'+k:''+k);
                const isAxis = h.name===axisName;
                return `<div class="rank-row ${isAxis?'axis':''}">
                  <span class="rk-pos">${h.jinguNinki}</span>
                  <span class="rk-name">${h.name}${isAxis?' ◎':''}</span>
                  <span class="rk-market">市場${h.marketNinki}人気</span>
                  <span class="rk-kairi ${kcls}">${ksign}</span>
                </div>`;
              }).join('');
              return `<details class="sec-details">
                <summary>⛩ ${r.name} 神宮スコアランキング（全${ranked.length}頭）</summary>
                <div class="rank-board">
                  <div class="rank-hint">神宮独自スコアの全頭順位／◎＝軸（乖離+3の神宮スコア最上位）</div>
                  <div class="rank-list">${rows}</div>
                </div>
              </details>`;
            })()}
            ${(() => {
              const withK = r.previewHorses.filter(h => typeof h.kairi === 'number');
              if (withK.length === 0) return '';
              // 神宮スコア順（jinguNinki昇順）で表示 → 神宮上位の宝が上に来る
              const ups = [...withK].filter(h=>h.kairi>=3).sort((a,b)=>(a.jinguNinki||999)-(b.jinguNinki||999)).slice(0,6);
              const dns = [...withK].filter(h=>h.kairi<=-3).sort((a,b)=>(a.jinguNinki||999)-(b.jinguNinki||999)).slice(0,6);
              const fmt = (h, sign) => `<div class="kairi-row ${sign>0?'up':'dn'}">
                <span class="k-icon">${sign>0?'📈':'📉'}</span>
                <span class="k-name">${h.name}</span>
                <span class="k-trans">市場${h.marketNinki}人気→神宮スコア${h.jinguNinki}位</span>
                <span class="k-delta">${sign>0?'+':''}${h.kairi}</span>
              </div>`;
              return `
              <div class="kairi-board">
                <h3>🎯 神宮スコア vs 市場オッズ 乖離ダッシュボード</h3>
                <div class="kairi-board-cols">
                  <div class="kairi-col treasure">
                    <h4>💎 神宮の宝（市場が見過ごす過小評価）</h4>
                    ${ups.length? ups.map(h=>fmt(h,1)).join('') : '<div class="kairi-row"><span class="k-trans">該当馬なし</span></div>'}
                  </div>
                  <div class="kairi-col trap">
                    <h4>⚠ 市場の罠（買いすぎの過剰評価）</h4>
                    ${dns.length? dns.map(h=>fmt(h,-1)).join('') : '<div class="kairi-row"><span class="k-trans">該当馬なし</span></div>'}
                  </div>
                </div>
              </div>`;
            })()}
            <div class="preview-grid">
              ${[...r.previewHorses].sort((a,b) => {
                // 神宮人気順（kotodamaScore降順）。jinguNinki未設定は最後尾
                const na = a.jinguNinki || 999;
                const nb = b.jinguNinki || 999;
                if (na !== nb) return na - nb;
                return (b.lapScore || 0) - (a.lapScore || 0);
              }).map(h => {
                const cat = h.jingu_category || '';
                const isBakuana = h.summary && h.summary.includes('爆穴');
                const isAnaUma = h.jingu_uma && cat === '消し';
                // 乖離(kairi)で色分け: +3以上=えんじ(神宮の宝)/-3以下=ブルー(市場の罠)/中間=クリーム
                const k = typeof h.kairi === 'number' ? h.kairi : 0;
                let cardCls = k >= 3 ? 'bakuana'
                            : k <= -3 ? 'place-cand'
                            : 'win-cand';
                let tagText = '';  // 旧バッジ廃止（神宮人気バッジに統一）
                return `
                <div class="preview-card ${cardCls}">
                  ${h.jinguNinki ? `<span class="jingu-ninki-corner r${h.jinguNinki<=3?h.jinguNinki:'X'}">⛩ 神宮スコア${h.jinguNinki}位</span>` : ''}
                  <div class="pc-head">
                    <span class="pc-name">${h.name}${(() => {
                      if (typeof h.kairi !== 'number') return '';
                      const k = h.kairi;
                      let cls, icon;
                      if (k >= 7) {cls='up-big'; icon='📈';}
                      else if (k >= 3) {cls='up-mid'; icon='📈';}
                      else if (k >= 1) {cls='up-sml'; icon='📈';}
                      else if (k <= -7) {cls='dn-big'; icon='📉';}
                      else if (k <= -3) {cls='dn-mid'; icon='📉';}
                      else if (k <= -1) {cls='dn-sml'; icon='📉';}
                      else {cls='eq'; icon='＝';}
                      return `<span class="kairi-badge ${cls}" title="市場${h.marketNinki}人気→神宮スコア${h.jinguNinki}位">${icon}${k>0?'+':''}${k}</span>`;
                    })()}${(typeof h.kairi === 'number' && h.kairi >= 5) ? '<span class="jingu-uma-badge">⛩️ 神宮馬 ⛩️</span>' : ''}${(h.lapType === '瞬発' || h.lapType === '両刀' ? '<span class="lap-badge syunpatsu">⚡ 瞬発</span>' : '') + (h.lapType === '持続' || h.lapType === '両刀' ? '<span class="lap-badge jizoku">💪 持続</span>' : '')}</span>
                    <span class="pc-meta">${h.sex?`<b>${h.sex}</b> ／ `:''}${h.kg!=null?h.kg+'kg ／ ':''}${h.jockey?h.jockey+'騎手 ／ ':''}${h.trainer||''}${h.pop?` ／ <b>想定${h.pop}人気</b>`:''}</span>
                    ${(h.lastRaceName||h.rotation) ? `<span class="pc-lastrap">${h.lastRaceResult!=null?`<b class="lr-chakujun">${h.lastRaceResult}着</b> `:''}${h.lastRaceName?`${h.lastRaceName}（${h.lastRaceVenue||''}）`:''}${h.rotation?` <span class="lr-rote">${h.rotation}</span>`:''}${h.kyakushitsu?` <span class="lr-kyaku">${h.kyakushitsu}</span>`:''}</span>` : ''}
                    <span class="pc-summary">${h.summary || ''}</span>
                  </div>
                  ${h.shrine_view ? `<div class="pc-view">${h.shrine_view}</div>` : ''}
                  ${h.buy ? `<div class="pc-buy"><b>🟢 買い</b>${h.buy}</div>` : ''}
                  ${h.concern ? `<div class="pc-concern"><b>🔴 懸念</b>${h.concern}</div>` : ''}
                  ${h.watchpoint ? `<div class="pc-watch"><b>👁 注目点</b>${h.watchpoint}</div>` : ''}
                </div>`;
              }).join('')}
            </div>
            </details>` : ''}

          </div>
        </details>`;
    }).join('');
  })
  .catch(e => {
    document.getElementById('races').innerHTML = '<div class="loading">⚠ データ読み込みに失敗しました</div>';
    console.error(e);
  });
</script>
</body>
</html>
